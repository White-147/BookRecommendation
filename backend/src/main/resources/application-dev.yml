spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 数据库连接（可用环境变量 SPRING_DATASOURCE_DRUID_URL/USERNAME/PASSWORD 覆盖，如 Render + TiDB 部署）
      url: ${SPRING_DATASOURCE_DRUID_URL:jdbc:mysql://localhost:3306/library?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=true&nullCatalogMeansCurrent=true}
      username: ${SPRING_DATASOURCE_DRUID_USERNAME:root}
      password: ${SPRING_DATASOURCE_DRUID_PASSWORD:root}
      # 连接池参数（TiDB Serverless 等低并发场景需调小，可用环境变量覆盖）
      initial-size: ${SPRING_DATASOURCE_DRUID_INITIAL_SIZE:10}
      max-active: ${SPRING_DATASOURCE_DRUID_MAX_ACTIVE:100}
      min-idle: ${SPRING_DATASOURCE_DRUID_MIN_IDLE:10}
      max-wait: 60000
      max-pool-prepared-statement-per-connection-size: 20
      time-between-log-stats-millis: 60000
      min-evictable-idle-time-millis: 300000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      logic-delete-value: -1
      logic-not-delete-value: 0
      logic-delete-field: is_deleted
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  tomcat:
    uri-encoding: UTF-8
  servlet:
    context-path: /book_recommendation
  port: 8081
  address: 0.0.0.0   # 允许局域网访问