server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 代理（前端 axios baseURL 指向 /book_recommendation）
    location /book_recommendation/ {
        proxy_pass http://backend:8081/book_recommendation/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
