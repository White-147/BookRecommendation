# Kafka 消费者地址（Docker 全链路在容器内由环境变量 BOOK_KAFKA_BROKER 覆盖为 kafka:9092，见 docker-compose.yml）
kafka.broker=localhost:9092
# JDBC 回写默认值（Step8/NewBookRecommend/RelatedBookRecommend 读取）
# 可用环境变量 BOOK_DB_URL / BOOK_DB_USER / BOOK_DB_PASSWORD 覆盖（见 com.hytc.util.JdbcConfig）
db.url=jdbc:mysql://localhost:3306/library
db.user=root
db.password=root
